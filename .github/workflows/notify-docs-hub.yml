# Poke userdata-cloud/docs after docs changes so the public hub regenerates.
# Secret DOCS_DISPATCH_TOKEN is optional. When it is unset, this job exits 0.

name: Notify docs hub

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-source-updated
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN is not set; skip notify."
            exit 0
          fi
          gh api "repos/userdata-cloud/docs/dispatches" \
            -f event_type=docs-source-updated \
            -f "client_payload[source]=${{ github.repository }}" \
            -f "client_payload[ref]=${{ github.ref }}" \
            -f "client_payload[sha]=${{ github.sha }}"

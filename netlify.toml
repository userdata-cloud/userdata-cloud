# GitHub Actions (.github/workflows/deploy-netlify.yml) publishes production once
# NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID exist on the repository.
# Until those secrets exist, the Netlify Git connection remains the publisher.
# Remove that connection after the secrets exist so two publishers do not race.
# This file still names the build command and the publish directory for the CLI.

[build]
  # Netlify's Node image may not expose pnpm until Corepack activates the version from `package.json#packageManager`.
  # Leave the site UI "Base directory" at repo root so `pnpm-lock.yaml` and the workspace are visible.
  command = "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm --filter @prv/site build"
  publish = "apps/site/.output/public"

[build.environment]
  NODE_VERSION = "22"
